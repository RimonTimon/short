<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pro Link Tools - Shortener & QR Generator</title>
  
  <!-- Tailwind CSS for professional styling -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- QR Code Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    body { font-family: 'Inter', sans-serif; }
    /* Custom scrollbar for smooth feel */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #f1f1f1; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    
    .fade-in { animation: fadeIn 0.4s ease-in-out; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-50 min-h-screen text-slate-800 p-4 md:p-8 flex flex-col items-center">

  <!-- Header -->
  <header class="text-center mb-10 mt-6 fade-in">
    <h1 class="text-4xl md:text-5xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-blue-600 to-indigo-600 mb-3">
      Pro Link Tools
    </h1>
    <p class="text-slate-500 text-lg">Shorten your links and generate beautiful QR codes instantly.</p>
  </header>

  <!-- Main Container -->
  <main class="w-full max-w-4xl grid grid-cols-1 md:grid-cols-2 gap-6 fade-in">
    
    <!-- Tool 1: URL Shortener -->
    <div class="bg-white rounded-2xl shadow-xl p-6 md:p-8 border border-slate-100 transition-all hover:shadow-2xl">
      <div class="flex items-center gap-3 mb-6">
        <div class="bg-blue-100 p-2 rounded-lg text-blue-600">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"></path></svg>
        </div>
        <h2 class="text-xl font-semibold text-slate-800">URL Shortener</h2>
      </div>

      <form id="shortenForm" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-slate-600 mb-1">Paste your long URL</label>
          <input type="url" id="longUrl" placeholder="https://example.com/very/long/link" required
            class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all">
        </div>
        <button type="submit" id="shortenBtn" 
          class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-4 rounded-xl transition-all active:scale-95 disabled:opacity-70 disabled:cursor-not-allowed flex justify-center items-center gap-2">
          <span>Shorten Link</span>
        </button>
      </form>

      <!-- Shortener Result -->
      <div id="shortenResult" class="hidden mt-6 bg-slate-50 rounded-xl p-5 border border-slate-200 fade-in">
        <p class="text-sm text-slate-500 mb-2">Your short link:</p>
        <div class="flex items-center gap-2 mb-4">
          <input type="text" id="shortUrlOutput" readonly class="w-full bg-white px-3 py-2 rounded-lg border border-slate-200 text-blue-600 font-medium focus:outline-none">
          <button id="copyBtn" class="bg-white hover:bg-slate-100 border border-slate-300 text-slate-700 p-2 rounded-lg transition-all active:scale-95" title="Copy">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
          </button>
        </div>
        
        <div class="flex flex-col items-center border-t border-slate-200 pt-4">
          <div id="qrShort" class="bg-white p-2 rounded-xl shadow-sm mb-3"></div>
          <button id="downloadShortQr" class="text-sm text-blue-600 hover:text-blue-800 font-medium flex items-center gap-1">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
            Download QR Code
          </button>
        </div>
      </div>
      <div id="shortenError" class="hidden mt-4 text-red-500 text-sm font-medium"></div>
    </div>

    <!-- Tool 2: QR Code Generator -->
    <div class="bg-white rounded-2xl shadow-xl p-6 md:p-8 border border-slate-100 transition-all hover:shadow-2xl">
      <div class="flex items-center gap-3 mb-6">
        <div class="bg-indigo-100 p-2 rounded-lg text-indigo-600">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm14 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z"></path></svg>
        </div>
        <h2 class="text-xl font-semibold text-slate-800">QR Generator</h2>
      </div>

      <form id="qrForm" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-slate-600 mb-1">Enter any link or text</label>
          <input type="text" id="qrInput" placeholder="https://any-website.com" required
            class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all">
        </div>
        <button type="submit" 
          class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 px-4 rounded-xl transition-all active:scale-95">
          Generate QR Code
        </button>
      </form>

      <!-- QR Result -->
      <div id="qrResult" class="hidden mt-6 bg-slate-50 rounded-xl p-5 border border-slate-200 flex flex-col items-center fade-in">
        <div id="qrCustom" class="bg-white p-3 rounded-xl shadow-sm mb-4"></div>
        <button id="downloadCustomQr" 
          class="bg-indigo-100 hover:bg-indigo-200 text-indigo-700 font-semibold py-2 px-6 rounded-lg transition-all active:scale-95 flex items-center gap-2">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
          Download QR
        </button>
      </div>
    </div>

  </main>

<script>
  // --- Tool 1: URL Shortener Logic ---
  const shortenForm = document.getElementById('shortenForm');
  const shortenBtn = document.getElementById('shortenBtn');
  const longUrlInput = document.getElementById('longUrl');
  const shortenResult = document.getElementById('shortenResult');
  const shortUrlOutput = document.getElementById('shortUrlOutput');
  const shortenError = document.getElementById('shortenError');
  const qrShortContainer = document.getElementById('qrShort');
  
  let qrShortInstance = null;

  shortenForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const url = longUrlInput.value.trim();
    if (!url) return;

    // Reset UI
    shortenBtn.disabled = true;
    shortenBtn.innerHTML = `<svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> Processing...`;
    shortenResult.classList.add('hidden');
    shortenError.classList.add('hidden');
    qrShortContainer.innerHTML = '';

    try {
      // NEW: Using os8.me which supports CORS for browser requests
      const response = await fetch('https://os8.me/', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ url: url })
      });

      const data = await response.json();

      // os8.me returns { status: 200, short_url: "..." }
      if (data.status === 200 && data.short_url) {
        shortUrlOutput.value = data.short_url;
        shortenResult.classList.remove('hidden');
        
        // Generate QR for short link
        qrShortInstance = new QRCode(qrShortContainer, {
          text: data.short_url,
          width: 120,
          height: 120,
          colorDark: "#1e293b",
          colorLight: "#ffffff",
          correctLevel: QRCode.CorrectLevel.H
        });
      } else {
        throw new Error(data.message || "Invalid URL or API error.");
      }
    } catch (error) {
      // Provide a more helpful error message
      let userMessage = "Could not shorten this link. ";
      if (error.name === 'TypeError' && error.message.includes('fetch')) {
        userMessage += "Please check your internet connection, or the shortener service might be temporarily down.";
      } else {
        userMessage += error.message;
      }
      shortenError.textContent = userMessage;
      shortenError.classList.remove('hidden');
    } finally {
      shortenBtn.disabled = false;
      shortenBtn.innerHTML = 'Shorten Link';
    }
  });

  // Copy Button
  document.getElementById('copyBtn').addEventListener('click', () => {
    shortUrlOutput.select();
    document.execCommand('copy');
    const copyBtn = document.getElementById('copyBtn');
    const originalHTML = copyBtn.innerHTML;
    copyBtn.innerHTML = `<svg class="w-5 h-5 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>`;
    setTimeout(() => copyBtn.innerHTML = originalHTML, 2000);
  });

  // Download Short QR
  document.getElementById('downloadShortQr').addEventListener('click', () => {
    const canvas = qrShortContainer.querySelector('canvas');
    if (canvas) {
      const a = document.createElement('a');
      a.href = canvas.toDataURL("image/png");
      a.download = "short-link-qr.png";
      a.click();
    }
  });


  // --- Tool 2: Custom QR Logic (No changes, this part already works) ---
  const qrForm = document.getElementById('qrForm');
  const qrInput = document.getElementById('qrInput');
  const qrResult = document.getElementById('qrResult');
  const qrCustomContainer = document.getElementById('qrCustom');
  
  let qrCustomInstance = null;

  qrForm.addEventListener('submit', (e) => {
    e.preventDefault();
    const text = qrInput.value.trim();
    if (!text) return;

    qrCustomContainer.innerHTML = '';
    qrResult.classList.remove('hidden');

    qrCustomInstance = new QRCode(qrCustomContainer, {
      text: text,
      width: 180,
      height: 180,
      colorDark: "#1e293b",
      colorLight: "#ffffff",
      correctLevel: QRCode.CorrectLevel.H
    });
  });

  // Download Custom QR
  document.getElementById('downloadCustomQr').addEventListener('click', () => {
    const canvas = qrCustomContainer.querySelector('canvas');
    if (canvas) {
      const a = document.createElement('a');
      a.href = canvas.toDataURL("image/png");
      a.download = "custom-qr-code.png";
      a.click();
    }
  });
</script>
</body>
</html>
